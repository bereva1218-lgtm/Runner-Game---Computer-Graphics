<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Game</title>
    <link rel="icon" type="image/PNG" href="./src/img/favicon.png">
    <!-- Hoja de estilos CSS -->
    <link rel="stylesheet" href="./src/css/style.css">

    <script type="importmap">
    {
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
    }
    </script>

</head>

<body>

    <!-- HUD (HEADS-UP DISPLAY)-->
    <div id="hud">
        <div class="hud-item">VIDAS <span id="hud-vidas">3</span></div>
        <div class="hud-item">GEMAS <span id="hud-gemas">0</span></div>
        <div class="hud-item">PUNTOS <span id="hud-puntos">0</span></div>
        <div class="hud-item">TIEMPO <span id="hud-tiempo">300</span></div>
    </div>

    <!-- Contenedor principal del juego / UI -->
    <div id="pantalla-inicio" class="pantalla oculto">
        <h1><b>Computer Graphics</b><br> <span class="acento">Runner Game</span></h1>

        <p class="pista">
            Golpea todos los bloques de ladrillo desde abajo para romperlos. <br>
            Salta sobre los enemigos para eliminarlos y ganar puntos. <br>
            Evita caer al vacío, ya que perderás una vida. <br>
        </p>

        <button id="btn-jugar">Jugar</button>

    </div>

    <!-- Pantalla de Pausa-->
    <div id="pantalla-pausa" class="pantalla oculto">
        <h1>PAUSA</h1>
        <p class="subtitulo">Presiona P para continuar</p>
    </div>

    <!-- Pantalla Final -->
    <div id="pantalla-fin" class="pantalla oculto">
        <h1>FIN DEL JUEGO</h1>
        <button id="btn-reiniciar">JUGAR DE NUEVO</button>
    </div>

    <script type="module" src="./src/js/game.js"></script>
</body>

</html>
